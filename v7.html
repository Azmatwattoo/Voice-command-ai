<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>AzDar AI V7</title>

<script
src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

/* =========================
   RESET
========================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}


/* =========================
   BODY
========================= */

body{
    font-family:Arial,sans-serif;
    background:#050816;
    color:white;
    min-height:100vh;
}


/* =========================
   CONTAINER
========================= */

.container{
    width:100%;
    max-width:1000px;
    margin:auto;
    padding:20px;
}


/* =========================
   HEADER
========================= */

header{
    text-align:center;
    padding:35px 20px;
    margin-bottom:20px;
    border-radius:25px;

    background:
        linear-gradient(
            135deg,
            #111827,
            #172554,
            #312e81
        );

    border:1px solid #334155;

    box-shadow:
        0 20px 50px rgba(0,0,0,.35);
}


/* =========================
   LOGO
========================= */

.logo{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
    margin-bottom:8px;
}

.logo-icon{
    width:58px;
    height:58px;
    border-radius:18px;

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:30px;
    font-weight:bold;

    background:
        linear-gradient(
            135deg,
            #2563eb,
            #7c3aed
        );

    box-shadow:
        0 0 30px rgba(59,130,246,.35);
}

.logo-name{
    font-size:38px;
    font-weight:800;
    letter-spacing:.5px;
}

.logo-name span{
    color:#60a5fa;
}

.creator{
    margin-top:4px;
    color:#94a3b8;
    font-size:13px;
}


/* =========================
   BADGE
========================= */

.badge{
    display:inline-block;

    margin-top:15px;

    padding:8px 16px;

    border-radius:30px;

    background:#2563eb;

    font-size:12px;
    font-weight:bold;
}


/* =========================
   CARD
========================= */

.card{
    background:#0b1220;

    border:1px solid #1e293b;

    border-radius:20px;

    padding:22px;

    margin-bottom:20px;
}

.card h2{
    margin-bottom:15px;
}


/* =========================
   TEXTAREA
========================= */

textarea{
    width:100%;

    min-height:130px;

    padding:15px;

    border-radius:14px;

    border:1px solid #334155;

    background:#050816;

    color:white;

    resize:vertical;

    outline:none;

    font-size:15px;
}


/* =========================
   INPUTS
========================= */

.auth-input{
    width:100%;

    padding:14px;

    margin-top:12px;

    border-radius:12px;

    border:1px solid #334155;

    background:#050816;

    color:white;

    outline:none;

    font-size:15px;
}


/* =========================
   BUTTON
========================= */

.btn{
    border:none;

    border-radius:12px;

    padding:12px 18px;

    margin-top:12px;

    background:#2563eb;

    color:white;

    font-weight:bold;

    cursor:pointer;
}

.btn:hover{
    opacity:.85;
}


/* =========================
   ANSWER
========================= */

.answer{
    margin-top:15px;

    padding:15px;

    min-height:70px;

    border-radius:14px;

    background:#050816;

    border:1px solid #1e293b;

    line-height:1.6;

    white-space:pre-wrap;
}


/* =========================
   FEATURES
========================= */

.features{
    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:12px;
}

.feature{
    padding:18px;

    text-align:center;

    border-radius:15px;

    background:#111827;

    border:1px solid #1e293b;
}


/* =========================
   FOOTER
========================= */

footer{
    text-align:center;

    padding:25px;

    color:#64748b;

    font-size:13px;
}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    .container{
        padding:12px;
    }

    .logo-name{
        font-size:30px;
    }

    .logo-icon{
        width:50px;
        height:50px;
        font-size:25px;
    }

    .features{
        grid-template-columns:
            repeat(2,1fr);
    }

}


/* =========================
   ACCOUNT BUTTONS
========================= */

.account-buttons{
    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:12px;
}


/* =========================
   AUTH BOX
========================= */

#authBox{
    margin-top:18px;
}

</style>

</head>


<body>


<div class="container">


<!-- =========================
     ACCOUNT
========================= -->

<div class="card">

    <h2>🔐 Account</h2>

    <div class="account-buttons">

        <button
            class="btn"
            onclick="showRegister()"
        >
            📝 Register
        </button>

        <button
            class="btn"
            onclick="showLogin()"
        >
            🔑 Login
        </button>

    </div>

    <div id="authBox"></div>

</div>


<!-- =========================
     HEADER
========================= -->

<header>

    <div class="logo">

        <div class="logo-icon">
            ✦
        </div>

        <div>

            <div class="logo-name">
                AzDar <span>AI</span>
            </div>

            <div class="creator">
                Created by Azmat Ali
            </div>

        </div>

    </div>


    <span class="badge">
        VERSION 7 • SMART AI
    </span>

</header>


<!-- =========================
     AI ASSISTANT
========================= -->

<div class="card">

    <h2>
        ✨ Ask AzDar AI
    </h2>

    <textarea
        id="question"
        placeholder="Ask anything..."
    ></textarea>

    <button
        class="btn"
        onclick="askAI()"
    >
        ✨ Ask AI
    </button>

    <div
        class="answer"
        id="answer"
    >
        AI answer will appear here...
    </div>

</div>


<!-- =========================
     FEATURES
========================= -->

<div class="card">

    <h2>
        ⚡ V7 Features
    </h2>

    <div class="features">

        <div class="feature">
            🤖<br>
            Smart AI
        </div>

        <div class="feature">
            🎤<br>
            Voice
        </div>

        <div class="feature">
            🔎<br>
            Search
        </div>

        <div class="feature">
            🌐<br>
            Web
        </div>

        <div class="feature">
            ⚙️<br>
            Commands
        </div>

        <div class="feature">
            📜<br>
            History
        </div>

    </div>

</div>


<!-- =========================
     FOOTER
========================= -->

<footer>

    AzDar AI V7

    <br>

    Created by Azmat Ali

</footer>


</div>


<script>


/* =========================
   REGISTER UI
========================= */

function showRegister(){

    document.getElementById("authBox").innerHTML = `

        <div class="card">

            <div class="logo">

                <div class="logo-icon">
                    ✦
                </div>

                <div>

                    <div class="logo-name">
                        AzDar <span>AI</span>
                    </div>

                    <div class="creator">
                        Created by Azmat Ali
                    </div>

                </div>

            </div>


            <h2 style="margin-top:20px;">
                📝 Create Account
            </h2>


            <input
                id="registerName"
                class="auth-input"
                type="text"
                placeholder="Your Name"
            >


            <input
                id="registerEmail"
                class="auth-input"
                type="email"
                placeholder="Email Address"
            >


            <input
                id="registerPassword"
                class="auth-input"
                type="password"
                placeholder="Password"
            >


            <button
                class="btn"
                onclick="registerUser()"
            >
                Create Account
            </button>

        </div>

    `;

}


/* =========================
   LOGIN UI
========================= */

function showLogin(){

    document.getElementById("authBox").innerHTML = `

        <div class="card">

            <div class="logo">

                <div class="logo-icon">
                    ✦
                </div>

                <div>

                    <div class="logo-name">
                        AzDar <span>AI</span>
                    </div>

                    <div class="creator">
                        Created by Azmat Ali
                    </div>

                </div>

            </div>


            <h2 style="margin-top:20px;">
                🔑 Login
            </h2>


            <input
                id="loginEmail"
                class="auth-input"
                type="email"
                placeholder="Email Address"
            >


            <input
                id="loginPassword"
                class="auth-input"
                type="password"
                placeholder="Password"
            >


            <button
                class="btn"
                onclick="loginUser()"
            >
                Login
            </button>

        </div>

    `;

}


/* =========================
   REGISTER FUNCTION
========================= */

function registerUser(){

    alert(
        "Registration system will be connected in the next step."
    );

}


/* =========================
   LOGIN FUNCTION
========================= */

function loginUser(){

    alert(
        "Login system will be connected in the next step."
    );

}


/* =========================
   AI ASSISTANT
========================= */

async function askAI(){

    const question =
        document
        .getElementById("question")
        .value
        .trim();


    const answer =
        document
        .getElementById("answer");


    if(!question){

        answer.innerText =
            "Please enter a question.";

        return;
    }


    answer.innerText =
        "Thinking...";


    try{

        const response =
            await fetch(
                "https://voice-command-ai-five.vercel.app/api/ask",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            question:question
                        })
                }
            );


        const contentType =
            response.headers
            .get("content-type");


        if(
            !response.ok ||
            !contentType ||
            !contentType.includes(
                "application/json"
            )
        ){

            throw new Error(
                "Server returned an invalid response."
            );

        }


        const data =
            await response.json();


        answer.innerText =
            data.answer ||
            data.response ||
            data.message ||
            "No answer received.";

    }


    catch(error){

        console.error(error);

        answer.innerText =
            "AI connection error.";

    }

}


/* =========================
   ENTER KEY
========================= */

document
.getElementById("question")
.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Enter" &&
            !event.shiftKey
        ){

            event.preventDefault();

            askAI();

        }

    }
);


</script>


</body>

</html>
