<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>AzDar AI V7</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#050816;
    color:white;
    min-height:100vh;
}

.container{
    width:100%;
    max-width:1000px;
    margin:auto;
    padding:20px;
}

header{
    text-align:center;
    padding:35px 20px;
    margin-bottom:20px;
    border-radius:25px;

    background:
        linear-gradient(
            135deg,
            #111827,
            #172554,
            #312e81
        );

    border:1px solid #334155;

    box-shadow:
        0 20px 50px rgba(0,0,0,.35);
}

.logo{
    font-size:38px;
    font-weight:bold;
    margin-bottom:8px;
}

.creator{
    color:#94a3b8;
    font-size:14px;
}

.badge{
    display:inline-block;
    margin-top:15px;
    padding:8px 16px;
    border-radius:30px;
    background:#2563eb;
    font-size:12px;
    font-weight:bold;
}

.card{
    background:#0b1220;
    border:1px solid #1e293b;
    border-radius:20px;
    padding:22px;
    margin-bottom:20px;
}

.card h2{
    margin-bottom:15px;
}

textarea{
    width:100%;
    min-height:130px;
    padding:15px;
    border-radius:14px;
    border:1px solid #334155;
    background:#050816;
    color:white;
    resize:vertical;
    outline:none;
    font-size:15px;
}

.btn{
    border:none;
    border-radius:12px;
    padding:12px 18px;
    margin-top:12px;
    background:#2563eb;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

.btn:hover{
    opacity:.85;
}

.answer{
    margin-top:15px;
    padding:15px;
    min-height:70px;
    border-radius:14px;
    background:#050816;
    border:1px solid #1e293b;
    line-height:1.6;
    white-space:pre-wrap;
}

.features{
    display:grid;
    grid-template-columns:
        repeat(3,1fr);
    gap:12px;
}

.feature{
    padding:18px;
    text-align:center;
    border-radius:15px;
    background:#111827;
    border:1px solid #1e293b;
}

footer{
    text-align:center;
    padding:25px;
    color:#64748b;
    font-size:13px;
}

@media(max-width:600px){

    .container{
        padding:12px;
    }

    .logo{
        font-size:30px;
    }

    .features{
        grid-template-columns:
            repeat(2,1fr);
    }
}

</style>

</head>

<body>

<div class="container">

<header>

    <div class="logo">
        🤖 AzDar AI
    </div>

    <div class="creator">
        Created by Azmat Ali
    </div>

    <span class="badge">
        VERSION 7 • SMART AI
    </span>

</header>


<div class="card">

    <h2>✨ Ask AzDar AI</h2>

    <textarea
        id="question"
        placeholder="Ask anything..."
    ></textarea>

    <button
        class="btn"
        onclick="askAI()"
    >
        ✨ Ask AI
    </button>

    <div
        class="answer"
        id="answer"
    >
        AI answer will appear here...
    </div>

</div>


<div class="card">

    <h2>⚡ V7 Features</h2>

    <div class="features">

        <div class="feature">
            🤖<br>
            Smart AI
        </div>

        <div class="feature">
            🎤<br>
            Voice
        </div>

        <div class="feature">
            🔎<br>
            Search
        </div>

        <div class="feature">
            🌐<br>
            Web
        </div>

        <div class="feature">
            ⚙️<br>
            Commands
        </div>

        <div class="feature">
            📜<br>
            History
        </div>

    </div>

</div>


<footer>

    AzDar AI V7

    <br>

    Created by Azmat Ali

</footer>

</div>


<script>

async function askAI(){

    const question =
        document.getElementById(
            "question"
        ).value.trim();

    const answer =
        document.getElementById(
            "answer"
        );

    if(!question){

        answer.innerText =
            "Please enter a question.";

        return;
    }

    answer.innerText =
        "Thinking...";

    try{

        const response =
            await fetch(
                "https://voice-command-ai-five.vercel.app/api/ask",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            question:question
                        })
                }
            );

        const data =
            await response.json();

        answer.innerText =
            data.answer ||
            data.response ||
            data.message ||
            "No answer received.";

    }catch(error){

        console.error(error);

        answer.innerText =
            "AI connection error.";
    }
}


document.getElementById(
    "question"
).addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Enter" &&
            !event.shiftKey
        ){

            event.preventDefault();

            askAI();
        }
    }
);

</script>

</body>
</html>
